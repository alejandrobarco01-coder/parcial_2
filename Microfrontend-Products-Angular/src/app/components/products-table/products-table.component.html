<table class="table table-striped border">
	<thead>
		<tr>
			<th scope="col">Id</th>
			<th scope="col">Nombre</th>
			<th scope="col">Precio</th>
			<th scope="col">Categoria</th>
			<th scope="col"><span class="visually-hidden">Acciones</span></th>
		</tr>
	</thead>
	<tbody>
		@for (product of products; track product) {
			<tr>
				<th scope="row">{{ product.id }}</th>
				<td>{{ product.name }}</td>
				<td>{{ product.price | currency }}</td>
				<td>
					<dsb-badge-atom
						[text]="product.category"
						[type]="categoryMap[product.category]" >
					</dsb-badge-atom>
				</td>
				<td><button class="btn btn-link btn-sm" type="button" (click)="productSelected.emit(product.id)" [attr.aria-label]="'Ver detalle de ' + product.name">Ver detalle</button></td>
			</tr>
		}
	</tbody>
</table>
