@switch(state){
  @case('loading'){
    <app-alert alertState="loading" text="Cargando ventas..." ></app-alert>
  }

  @case('error'){
    <app-alert alertState="error" text="Error al cargar las ventas" ></app-alert>
  }

  @case('success'){
    <app-sales-table [sales]="sales" ></app-sales-table>
  }
}
